[package]
name = "s1-window-windows"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "s1-window-windows"
path = "src/main.rs"

[[bin]]
name = "raw-repro"
path = "src/raw_repro.rs"

[dependencies]
egui = "0.36.1"
egui-wgpu = "0.36.1"
egui-winit = "0.36.1"
env_logger = "0.11.11"
global-hotkey = "0.8.0"
log = "0.4.34"
pollster = "1.0.1"
raw-window-handle = "0.6"
wgpu = { version = "30", features = ["dx12", "vulkan"] }
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectComposition", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
winit = { version = "0.30", features = ["rwh_06"] }

# Patch local, spike S1 uniquement — voir README.md de ce dossier pour le détail complet des
# deux bugs corrigés (ALLOW_TEARING et SwapEffect, tous deux incompatibles avec
# CreateSwapChainForComposition sur cette configuration). `vendor/` n'est PAS commité : lancer
# `bash patches/setup-vendor.sh` après un clone pour le régénérer depuis crates.io + le patch.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal-30.0.1" }
