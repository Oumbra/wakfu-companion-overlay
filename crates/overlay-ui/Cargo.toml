[package]
name = "overlay-ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Fenetre overlay transparente (Windows, DirectComposition — voir S1) rendant les deux premiers panneaux de L2 (degats du combat en cours, recap de session) a partir d'overlay-engine/overlay-ingest."

[dependencies]
overlay-engine = { path = "../overlay-engine" }
overlay-ingest = { path = "../overlay-ingest" }
overlay-sync = { path = "../overlay-sync" }

arc-swap = "1"
crossbeam-channel = "0.5"
ctrlc = "3"
directories = "5"
egui = "0.36.1"
egui-wgpu = "0.36.1"
egui-winit = "0.36.1"
global-hotkey = "0.8.0"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
pollster = "1.0.1"
raw-window-handle = "0.6"
rodio = { version = "0.21", default-features = false, features = ["mp3", "playback"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "30", features = ["dx12", "vulkan"] }
winit = { version = "0.30", features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
] }
