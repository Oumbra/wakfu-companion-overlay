[package]
name = "overlay-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Fenetre overlay transparente (Windows, DirectComposition — voir S1) rendant les deux premiers panneaux de L2 (degats du combat en cours, recap de session) a partir d'overlay-engine/overlay-ingest."

# **Nom des exécutables livrés** — `wakfu-companion-overlay.exe` sous Windows, et non le nom du
# paquet.
# Sans ce bloc, Cargo nomme le binaire d'après `[package] name` : l'utilisateur téléchargeait un
# `overlay-ui.exe`, un nom de module interne qui ne dit ni le produit ni le jeu, et qui se perd dans
# une liste de processus. Le nom des ASSETS de Release, lui, portait déjà le bon
# (`wakfu-companion-overlay-{version}-windows-x86_64.exe.gz`, voir `.github/workflows/release.yml`).
#
# `src/bin/*.rs` reste découvert automatiquement à côté, et suit la même règle :
# `wakfu-companion-overlay-x11` est le binaire Linux/X11 (§17.2 du plan), nommé d'après son fichier.
# Seul `overlay-focus` garde un nom d'outil (gestionnaire du protocole `wakfu-companion:`, voir son
# en-tête) : il est cherché PAR NOM par l'overlay (`turn_watch::notify`), le renommer casserait le
# clic sur un toast de tour.
[[bin]]
name = "wakfu-companion-overlay"
path = "src/main.rs"

[dependencies]
overlay-engine = { path = "../overlay-engine" }
overlay-ingest = { path = "../overlay-ingest" }
overlay-sync = { path = "../overlay-sync" }
overlay-platform = { path = "../overlay-platform" }

arc-swap = "1"
# Heure LOCALE du début de la session du Récap (« Session depuis 20:12 », `recap_session`) — même
# dépendance et mêmes fonctionnalités que le moteur (`overlay_engine::log_time`), même raison : le
# fuseau courant de la machine est délégué à l'OS, aucune base de fuseaux embarquée.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
ctrlc = "3"
directories = "5"
egui = "0.36.1"
egui-wgpu = "0.36.1"
egui-winit = "0.36.1"
global-hotkey = "0.8.0"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
open = "5"
pollster = "1.0.1"
raw-window-handle = "0.6"
rfd = "0.15"
rodio = { version = "0.21", default-features = false, features = ["mp3", "playback"] }
serde = { version = "1", features = ["derive"] }
# Transporte l'objet `profile` BRUT du compte entre le thread Engine et la fenêtre Options :
# réécrire les alertes sans repartir de cet objet effacerait le pseudo et l'avatar du compte
# (voir `overlay_engine::AlertProfile::patch_value`).
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "30", features = ["dx12", "vulkan"] }
winit = { version = "0.30", features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
# Icône de zone de notification et son menu (Options / Mise à jour / Déconnecter / Quitter —
# 2026-09-14, §9.1 undecies du plan). Mêmes auteurs que `global-hotkey` (tauri-apps), même modèle : un récepteur
# d'événements sondé depuis la boucle winit. Windows uniquement : ses fonctionnalités par défaut
# tirent GTK/libappindicator sous Linux, que le binaire X11 n'utilise pas (voir sa doc de module).
tray-icon = { version = "0.25", default-features = false }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  # `SendInput` — frappe clavier synthetique des raccourcis multicompte (`chat_command`).
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  # Surveillance de tour (`turn_watch`, §9.1 decies) : `PrintWindow` vit dans `Storage_Xps`
  # (héritage de l'API d'impression), le toast dans WinRT `UI_Notifications` + `Data_Xml_Dom`.
  "Win32_Storage_Xps",
  "Win32_System_WinRT",
  "Win32_System_Registry",
  "Win32_System_Threading",
  # `AttachConsole` — l'exe est fenêtré sans fenêtre (`windows_subsystem = "windows"`, voir
  # `main.rs`) ; lancé depuis un terminal, il se rattache à la console de celui-ci pour que le
  # journal reste lisible en développement (`logging::attach_parent_console`).
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Foundation",
  "UI_Notifications",
  "Data_Xml_Dom",
] }

# Icône et métadonnées de l'exécutable Windows (`build.rs`) — l'icône est celle de la zone de
# notification et de la fenêtre, dérivée d'`assets/ui/logo-purple.png` au build plutôt que commitée
# en `.ico` : une seule source de vérité pour le logo du projet.
#
# `[target.'cfg(windows)']` d'un bloc `build-dependencies` désigne la plateforme HÔTE (c'est là que
# tourne `build.rs`) — pas la cible. C'est ce qu'on veut : on ne compile jamais le binaire Windows
# ailleurs que sous Windows (`release.yml`, job `build-windows`), et `build.rs` revérifie la cible
# (`CARGO_CFG_TARGET_OS`) avant de poser quoi que ce soit.
[target.'cfg(windows)'.build-dependencies]
# Compile la ressource `.rc` (icône + bloc de version) et la fait lier dans l'exe. Fork maintenu de
# `winres`. `default-features = false` retire sa lecture de `[package.metadata.winresource]` (et
# avec elle `toml`/`syn` du graphe de build) : les quelques propriétés posées le sont dans
# `build.rs`, à côté de l'icône, plutôt qu'à deux endroits.
winresource = { version = "0.1", default-features = false }
# Décodage du PNG source, redimensionnement, encodage `.ico` multi-tailles. Mêmes fonctionnalités
# que la dépendance applicative ci-dessus, plus `ico`.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
