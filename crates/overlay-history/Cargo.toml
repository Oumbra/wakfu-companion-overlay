[package]
name = "overlay-history"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Historique local de l'overlay (docs/plan-historique-local.md §6) : combats, achats, échanges et pactes dans une base SQLite sur le poste, sans serveur."

[dependencies]
overlay-engine = { path = "../overlay-engine" }
# Même version et même `bundled` qu'`overlay-sync` (file d'envoi) : une seule copie de SQLite
# compilée dans le binaire, aucune bibliothèque système requise.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
overlay-ingest = { path = "../overlay-ingest" }
