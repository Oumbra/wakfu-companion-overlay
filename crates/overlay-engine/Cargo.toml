[package]
name = "overlay-engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Frontiere metier : QuickJS + LogParser vendu depuis wakfu-companion (LineBatch -> LogEntry), agregation de session en Rust (LogEntry -> SessionSnapshot) — voir docs/plan-architecture.md §2 et §9."

[dependencies]
overlay-ingest = { path = "../overlay-ingest" }
rquickjs = "0.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
