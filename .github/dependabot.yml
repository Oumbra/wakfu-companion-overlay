# Mises à jour de dépendances proposées par Dependabot (audit de sécurité du 2026-09-23, O9).
#
# - Cible `dev` : tout travail converge sur `dev`, la fusion vers `main` reste au mainteneur.
# - `cooldown` de 7 jours : une version fraîchement publiée (éventuellement compromise puis retirée)
#   n'est jamais proposée le jour même.
# - AUCUN auto-merge : chaque PR se relit (les actions sont épinglées par SHA, Dependabot met à jour
#   le SHA et le commentaire de version ensemble).
# - `Cargo.lock` et la version du produit : une PR Dependabot touche `Cargo.lock` — c'est le seul
#   cas où il change hors d'un `cargo` local ; la relire comme n'importe quelle montée de dépendance.
version: 2
updates:
  - package-ecosystem: github-actions
    # Workflows ET action composite (ses `uses:` sont aussi épinglés par SHA).
    directories:
      - /
      - /.github/actions/vendor-wgpu-hal
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # `build:` ne bumpe pas la version ; le mainteneur requalifie en `fix:`/`feat:` à la fusion si la
    # montée change le comportement du binaire livré (CLAUDE.md, choix du préfixe).
    commit-message:
      prefix: build
