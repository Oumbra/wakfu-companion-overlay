# CI de base — docs/plan-architecture.md §8/§11 : build Windows + Linux, tests (dont parité,
# §2.2/§5.3), budget mémoire (`xtask mem-budget`, §8), lint `clippy -D warnings`.
#
# Ne couvre PAS le harnais comportemental Xvfb/X11 (`xtask visual-check`, §17.2) : il n'existe pas
# encore (aucun rendu Linux réel à piloter, voir §17.2 « État ») et devra de toute façon rester
# `workflow_dispatch` uniquement une fois écrit (§17.2 : « jamais un gate CI par défaut »
# pour ce harnais précis) — le contenu de ce fichier n'a donc pas vocation à y faire de la place.
#
# `overlay-ui::main` (le binaire `wakfu-companion-overlay`, nommé ainsi par le `[[bin]]` de son
# Cargo.toml et non d'après le paquet) importe `windows::` sans `cfg` et ne compile QUE sous
# Windows — d'où le découpage par paquet/binaire plutôt que `--workspace` partout : sa LIB
# (`--lib`) compile nativement sous Linux (voir `crates/overlay-ui/src/lib.rs`), tout comme le
# second binaire du même paquet, `wakfu-companion-overlay-x11` (§17.2 du plan) — build/clippy/test
# le ciblent donc explicitement en plus de `--lib`.
#
# `--no-fail-fast` sur CHAQUE `cargo test` : sans lui, cargo s'arrête au premier BINAIRE de test en
# échec et n'exécute pas les suivants. Ce n'est pas une subtilité théorique — `tests/design_gallery.rs`
# passe avant `tests/panels.rs` dans l'ordre alphabétique, et deux captures périmées dans le premier
# ont caché VINGT-ET-UNE captures périmées du second pendant une semaine : le journal du CI n'a
# jamais montré la moindre ligne de `panels.rs`. Un seul run doit dire TOUT ce qui est cassé, sinon
# chaque correctif ne révèle que le prochain échec, un aller-retour de CI à la fois. Même principe
# que `scripts/ci-local.sh`, qui déroule toutes ses étapes avant de récapituler.
#
# ⚠ SOURCE DE VÉRITÉ PARTAGÉE : la liste des vérifications ci-dessous est dupliquée dans
# `scripts/ci-local.sh`, qui les rejoue EN LOCAL avant un push (et que le hook `pre-push` de
# `.githooks/` lance en mode `--lint`). Toute étape ajoutée/retirée ici doit l'être là-bas aussi —
# ce script est le garde-fou qui évite de découvrir un `fmt`/`clippy` rouge après coup, et il ne
# protège que ce qu'il connaît. UNE seule divergence assumée : le job `test-linux` tourne ici dans
# un conteneur au rendu figé (voir sa doc), là où le script local tourne sur la machine du dev — il
# ne compte alors en échec que les écarts de capture trop grands pour du bruit de rastérisation.
#
# Workflow voisin : `.github/workflows/regen-captures.yml` (« Régénérer les captures »), lancé à la
# main, réécrit les références DANS ce même conteneur. C'est la seule voie de régénération depuis un
# poste Windows ou une session cloud, qui n'ont pas de Docker.
#
# La version de Rust vient de `rust-toolchain.toml` (épinglée), pas d'un `@stable` flottant : voir
# la doc de ce fichier — c'est la dérive de version qui a tenu ce CI rouge du 2026-09-01 au
# 2026-09-10, sur un seul écart de `cargo fmt`.
name: CI

on:
  push:
    branches: [dev, main, master]
    # Un commit qui ne touche QUE de la prose ne peut pas casser une compilation Rust : inutile de
    # dépenser cinq jobs (dont un Windows, facturé double) pour lui. `assets/**` n'est
    # VOLONTAIREMENT PAS dans cette liste — `assets/design-system/`, `assets/fonts/` et les assets
    # de `crates/overlay-ui/assets/` sont embarqués par `include_bytes!` (design/assets.rs,
    # design/fonts.rs, ui_icons.rs…) : les toucher peut casser la compilation ET les snapshots
    # d'`overlay-testkit`. GitHub n'applique l'exclusion que si TOUS les fichiers du push
    # correspondent — un push mêlant doc et code déclenche bien le CI.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:
  # Appelé aussi par `release-pr.yml` (job `ci`) : une branche de release n'est fusionnée dans
  # `main` qu'après ce CI complet sur son commit de tête — sans `paths-ignore`, une release de
  # pure documentation doit avoir un verdict elle aussi.
  workflow_call:

# Le travail se fait par rafales de petits commits successifs sur `dev` (voir l'historique) : sans
# ce garde-fou, chaque push d'une rafale lançait cinq jobs complets dont seul le dernier importait.
# Seul le run le plus récent d'une même branche survit ; les précédents sont annulés.
# Lecture seule : ce workflow ne publie rien (audit de sécurité du 2026-09-23). Sans ce bloc, le
# jeton hérite des droits par défaut du dépôt, écriture comprise.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Journal d'erreur exploitable quand un test panique en CI, sans avoir à repousser un commit
  # « ajoute un backtrace » pour comprendre.
  RUST_BACKTRACE: 1

# **`ubuntu-24.04`, jamais `ubuntu-latest`** (épinglé le 2026-09-18). GitHub annonce la bascule de
# `ubuntu-latest` vers Ubuntu 26 à partir du 2026-10-19 (annotation « notice » sur chaque run,
# actions/runner-images#14748) : c'est un changement d'OS, de version d'APT et de toolchain système
# qui arriverait un matin, sur du code que personne n'a touché. Ce dépôt a déjà payé ce prix une
# fois — dix jours de CI rouge sur une toolchain Rust flottante —, et le job `test-linux` épingle
# jusqu'au DIGEST de son conteneur pour la même raison. La date de la bascule est le bon moment pour
# monter à `ubuntu-26.04` : dans son propre commit, en regardant ce qui casse.
jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Purement textuel, aucune compilation : d'où sa place dans le job le plus rapide. Vérifie que
      # l'image de base du rendu porte le MÊME digest dans `ci.yml`, `regen-captures.yml` et
      # `.github/ci-image/Dockerfile` — une divergence ferait régénérer les références sous un Mesa
      # qui n'est plus celui du gate. Voir l'en-tête du script.
      - name: image de base du rendu, cohérente partout
        run: bash scripts/verifier-digest-rendu.sh
      # Même nature, même place : textuel et instantané. Le dépôt est public — une fixture
      # `wakfu.log` brute y publierait un jeton de session, une IP, un nom de compte Windows et les
      # pseudonymes et messages de tous les joueurs croisés ce jour-là (constat C1 de
      # `docs/analyse-rgpd.md`). Doublé par le hook `pre-commit`, qui ne survit pas à un conteneur
      # de session cloud : c'est CETTE étape qui fait foi.
      - name: fixtures sans données réelles
        run: bash scripts/check-fixtures.sh
      - name: Toolchain Rust (version épinglée par rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path xtask/Cargo.toml -- --check

  clippy-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain Rust (version épinglée par rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - name: dépendances système (rendu logiciel egui_kittest + son rodio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libasound2-dev pkg-config
      - uses: ./.github/actions/vendor-wgpu-hal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            xtask -> target
      - run: cargo clippy -p overlay-engine -p overlay-ingest -p overlay-sync -p overlay-platform --all-targets -- -D warnings
      - run: cargo clippy -p overlay-ui --lib --bin wakfu-companion-overlay-x11 -- -D warnings
      - run: cargo clippy -p overlay-testkit --all-targets -- -D warnings
      - run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

  test-linux:
    runs-on: ubuntu-24.04
    # **Conteneur ÉPINGLÉ PAR DIGEST, pas par tag** : le tag `ubuntu:24.04` désigne une image
    # différente à chaque point release. Depuis que la comparaison de captures est un GATE (voir
    # l'étape `overlay-testkit` plus bas), l'environnement de rendu ne peut plus bouger tout seul —
    # `ubuntu-latest` bascule de version majeure sans prévenir, et son `apt-get` sert ce qui est
    # publié le jour même. Deuxième verrou dans `scripts/setup-render-env.sh` : les paquets viennent
    # d'un instantané daté de l'archive Ubuntu, pas de l'archive vivante.
    #
    # Seul CE job est conteneurisé : `clippy-linux` ne fait que compiler, aucun pixel n'en sort.
    container:
      image: ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254
    steps:
      # AVANT `checkout` : une image Ubuntu nue n'a ni `git` ni `ca-certificates`, et `checkout`
      # retomberait sur un téléchargement d'archive REST au lieu d'un vrai clone. Ces trois paquets
      # ne participent à aucun rendu — leur version est sans importance, d'où l'archive par défaut
      # ici et l'instantané épinglé pour tout le reste, après le clone.
      - name: amorçage (git pour checkout — hors périmètre du rendu)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: environnement de rendu épinglé (Mesa/lavapipe, instantané daté — voir le script)
        run: bash scripts/setup-render-env.sh
      - name: Toolchain Rust (version épinglée par rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/vendor-wgpu-hal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - run: cargo test --no-fail-fast -p overlay-engine -p overlay-ingest -p overlay-sync -p overlay-platform
      - run: cargo test --no-fail-fast -p overlay-ui --lib
      - name: binaire Linux/X11 — compile (pas de tests unitaires, voir son fichier)
        run: cargo build -p overlay-ui --bin wakfu-companion-overlay-x11
      # **GATE depuis le 2026-09-13** (§17.1 du plan). Ce n'était plus tenable en « informatif » :
      # l'étape a caché vingt-et-une captures périmées pendant une semaine. Ce qui a rendu la
      # promotion possible, c'est l'environnement de rendu figé ci-dessus — un gate sur un rendu
      # flottant aurait rougi à la première mise à jour de Mesa, sur du code que personne n'a
      # touché.
      #
      # Une capture en écart FAIT ÉCHOUER le CI. Deux issues, jamais une troisième : le rendu a
      # régressé et on corrige le code, ou le changement visuel est voulu et on régénère les
      # références DANS l'environnement de rendu (voir `.github/ci-image/Dockerfile`), dans son
      # propre commit.
      - name: "overlay-testkit — captures offscreen (GATE, voir §17.1)"
        id: captures
        run: cargo test --no-fail-fast -p overlay-testkit
      # **Sans cette étape, un gate rouge est indéchiffrable.** Le journal ne dit que « Diff: 20563 »
      # — un nombre de pixels, qui ne dit ni QUOI a changé ni si c'est une régression. Les images de
      # diagnostic (`*.new.png`, le rendu OBTENU ; `*.diff.png`, les pixels en écart) sont produites
      # sur le runner puis jetées avec lui. Les publier, c'est la différence entre « je regarde ce
      # qui a changé » et « je reproduis l'environnement du CI en local pour le découvrir ».
      #
      # C'est aussi ce qui rend applicable la règle du §17.1 : une régénération de références se
      # relit sur ces images, jamais sur le diff git — un PNG modifié s'y affiche « Bin 693015 ->
      # 698936 bytes », et rien d'autre.
      #
      # `outcome` et non `conclusion` : `outcome` est le résultat BRUT de l'étape, avant toute
      # réécriture. La condition ne vise donc que l'échec des captures — un `cargo test` en échec
      # plus haut ne déclenche pas une publication vide. `if-no-files-found: error` assume le
      # contrat : si le gate est rouge, ces images existent forcément.
      - name: "captures en écart — rendu obtenu et diff (diagnostic)"
        if: always() && steps.captures.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: captures-en-ecart
          path: |
            crates/overlay-testkit/tests/snapshots/*.new.png
            crates/overlay-testkit/tests/snapshots/*.diff.png
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain Rust (version épinglée par rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: ./.github/actions/vendor-wgpu-hal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - run: cargo build --workspace
      # **Le code `cfg(windows)` n'était linté nulle part** (ajouté le 2026-09-18). `clippy-linux`
      # compile `overlay-ui --lib` sous Linux : tout ce qui est derrière un `cfg(windows)` y est
      # invisible — `turn_watch/capture.rs` (PrintWindow/GDI) et `turn_watch/notify.rs` en entier,
      # et le binaire `wakfu-companion-overlay` (`main.rs`, 4 000 lignes) n'y compile même pas. Côté
      # Windows, ce job ne faisait qu'un `build` : aucun lint. Résultat au premier essai de cette
      # étape : un `chunks_exact_mut` que clippy réclame depuis toujours dans `capture.rs`, jamais vu
      # de personne.
      #
      # Même PORTÉE que la ligne équivalente de `clippy-linux` (lib + le binaire de la plateforme,
      # pas `--all-targets`) : les deux jobs se répartissent ainsi les deux moitiés de `overlay-ui`
      # sans qu'aucune ne soit tenue à un verdict que l'autre n'applique pas.
      - run: cargo clippy -p overlay-ui --lib --bin wakfu-companion-overlay -- -D warnings
      - name: tests purs (sans GPU) — overlay-testkit/overlay-ui restent couverts côté Linux (lavapipe)
        run: cargo test --no-fail-fast -p overlay-engine -p overlay-ingest -p overlay-sync

  mem-budget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain Rust (version épinglée par rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: xtask -> target
      - run: cargo run --manifest-path xtask/Cargo.toml --release -- mem-budget
