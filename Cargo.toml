[workspace]
resolver = "2"
# `crates/*` uniquement — les crates sous `spikes/` sont des harnais jetables et indépendants
# (chacun son propre Cargo.lock, jamais résolus avec le workspace principal).
members = ["crates/*"]

[workspace.package]
# **Version UNIQUE du produit**, partagée par toutes les crates (`version.workspace = true`) et
# embarquée dans le binaire par `env!("CARGO_PKG_VERSION")` — voir `crates/overlay-ui/src/build_info.rs`.
#
# Ne JAMAIS l'éditer à la main : le hook `post-commit` (`.githooks/post-commit`, installé par
# `scripts/install-hooks.sh`) l'incrémente tout seul selon le type Conventional Commits du commit
# qui vient d'être créé — voir `scripts/bump-version.sh` pour la table des correspondances.
#
# `xtask/` a volontairement sa PROPRE version, figée : c'est de l'outillage de CI jamais distribué
# (son `[workspace]` vide le tient hors de ce workspace, voir son Cargo.toml), rien n'y est versionné
# pour l'utilisateur.
version = "0.77.0"
edition = "2021"
publish = false
# Licence du dépôt (fichier `LICENSE` à la racine) — décision du mainteneur, 2026-09-18.
license = "MIT"

# Profil des binaires LIVRÉS (Release GitHub, voir docs/plan-mise-a-jour.md §6 — phase 0). Sans ce
# bloc, `cargo build --release` gardait les symboles de débogage et n'optimisait pas entre crates :
# un exe sensiblement plus gros à télécharger à chaque mise à jour, pour rien.
#
# - `strip` : retire symboles et infos de débogage. Un panic en release n'a donc plus de backtrace
#   nominative — le journal (`overlay_ui::logging`) reste la source de diagnostic, comme aujourd'hui.
# - `lto = "fat"` + `codegen-units = 1` : optimisation inter-crates, code mort éliminé. Compilation
#   release plus longue (CI de release seulement : `ci.yml` ne compile jamais le produit en release,
#   et `xtask` a son propre workspace, donc son propre profil).
[profile.release]
strip = true
lto = "fat"
codegen-units = 1

# Profil de PRÉVISUALISATION locale (`crates/overlay-ui/preview.{ps1,sh}`, par défaut) : les mêmes
# optimisations de code que `release` (l'overlay doit être fluide pour être jugé), SANS ce qui ne
# sert qu'au binaire livré et coûte plusieurs minutes à chaque édition — constaté le 2026-09-16,
# le lendemain de l'arrivée du profil ci-dessus : la dernière unité (`overlay-ui`) passait de
# quelques secondes à 5–10 min, `codegen-units = 1` la rendant monothread et `lto = "fat"`
# ré-optimisant toute la chaîne (wgpu, egui, windows…) à chaque `cargo run`.
#
# - `lto = false` : LTO « thin local » de Cargo, celui de `release` avant le 2026-09-15.
# - `codegen-units = 16` : valeur par défaut de `release`, la compilation redevient parallèle.
# - `incremental = true` : seules les fonctions touchées sont recompilées d'une édition à l'autre.
# - `strip = false` : garde les backtraces nominatives, utiles justement quand on itère.
#
# Le résultat vit dans `target/preview/`, jamais dans `target/release/` : un binaire de Release
# (`.github/workflows/release.yml`) reste produit par `--release`, avec LTO fat et strip.
[profile.preview]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

# `overlay-ui` a besoin de DirectComposition sous Windows (fenêtre transparente, voir S1 —
# spikes/s1-window-windows/README.md pour le détail complet des deux bugs corrigés). `vendor/`
# n'est PAS commité (voir .gitignore) : lancer `bash patches/setup-vendor.sh` après un clone,
# avant tout `cargo build` touchant overlay-ui.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal-30.0.1" }
